[package]
name = "bolascan"
version = "0.2.4"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
repository = "https://github.com/santhreal/bolascan"
homepage = "https://santh.dev"
description = "IDOR / BOLA scanner consuming appmap; emits secfinding::Finding"
readme = "README.md"
keywords = ["idor", "bola", "access-control", "security", "scanner"]
categories = ["web-programming", "authentication"]
publish = true

[dependencies]
appmap = { package = "appsurface", path = "../../runtime/appsurface", version = "0.1.2" }
secfinding = { path = "../../scanner/secfinding", version = "0.4" }
respdiff = { path = "../../scanner/respdiff", version = "0.5" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "=0.8.23"
tokio = { workspace = true, features = ["rt", "macros"] }
clap = { workspace = true, features = ["derive"] }

[features]
default = ["tier-b-toml"]
tier-b-toml = []

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "bolascan-cli"
path = "src/bin/bolascan_cli.rs"

[[test]]
name = "detector_unit"
path = "tests/unit/detector.rs"

[[test]]
name = "probe_rest"
path = "tests/unit/probe_rest.rs"

[[test]]
name = "content_compare"
path = "tests/unit/content_compare.rs"

[[test]]
name = "scan_findings"
path = "tests/unit/scan_findings.rs"

[[test]]
name = "id_mutation_property"
path = "tests/property/id_mutation.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

[[test]]
name = "gap"
path = "tests/gap.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[package.metadata.santh]
status = "alpha"
